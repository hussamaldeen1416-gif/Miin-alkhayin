<style>

body{position:fixed;inset:0;-webkit-user-select:none;user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:none;touch-action:none}

.ov.meet,.ov.res{background:radial-gradient(120% 70% at 50% 0%,#47291a 0%,#120c0a 70%)}

.ov.day,.ov.lobby{background:none;pointer-events:none;padding:0;overflow:hidden;display:block}

.red{color:var(--red)!important}

.hint{position:absolute;bottom:28px;left:16px;color:rgba(255,255,255,.65);font-size:14px;max-width:46%;text-shadow:0 1px 2px #000}
.banner{position:absolute;top:84px;left:50%;transform:translateX(-50%);background:rgba(12,14,20,.85);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;white-space:nowrap}
.ov.lobby .banner{top:100px}
.hidden{display:none!important}
.leftCol{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.leftCol .pill{padding:8px 11px;font-size:20px}
.reactBar{position:absolute;left:62px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(12,14,20,.92);border:1px solid var(--line);border-radius:16px;padding:6px}

.reactBar .emb{font-size:22px;line-height:1.1}.reactBar .emb small{display:block;font-size:10px;color:var(--mut)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);z-index:20;padding:14px}
.modal.show{display:flex}
.mcard{width:100%;max-width:400px;max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px}
.mtip{color:var(--mut);text-align:center;margin-bottom:12px}
.lbl{font-weight:800;margin:12px 0 8px}
.ngrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nb{font-size:30px;padding:16px 0;background:#2c3247;color:#fff}
.nb.ok{background:var(--grn);color:#062417}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sp{aspect-ratio:1;background:var(--c);opacity:.3;border-radius:22px;transition:opacity .1s,transform .1s}
.sp.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 26px var(--c)}
.hbar{height:18px;border-radius:10px;background:#0b0d13;border:1px solid var(--line);overflow:hidden;margin:6px 0 14px}
.hbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ea8ff,#3ddc97)}
.holdBtn{width:100%;padding:28px;font-size:20px;touch-action:none}
.shake{animation:sh .35s}
.wire{position:relative;display:flex;justify-content:space-between;padding:6px 18px;min-height:250px}
.wsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wcol{display:flex;flex-direction:column;justify-content:space-between;gap:14px;position:relative;z-index:1}
.wd{width:52px;height:52px;border-radius:50%;background:var(--c);border:4px solid #0b0d13;padding:0}
.wd.sel{box-shadow:0 0 0 5px #fff}.wd.done{opacity:.55}
.bugArea{position:relative;height:260px;border-radius:16px;background:#0b0d13;border:1px solid var(--line);overflow:hidden}
.bug{position:absolute;width:64px;height:64px;font-size:40px;background:none;padding:0;transform:translate(-0%,0);touch-action:none}
.bug.pop{animation:bpop .22s}
@keyframes bpop{from{transform:scale(.3)}to{transform:scale(1)}}
.mgrid2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{aspect-ratio:1;font-size:40px;background:#2c3247;border-radius:16px;padding:0}
.mc span{visibility:hidden}.mc.up span{visibility:visible}.mc.up{background:#3b4566}.mc.ok{background:#1f5f3f}
.dial{position:relative;height:46px;border-radius:12px;background:#0b0d13;border:1px solid var(--line);margin:8px 0 16px;direction:ltr}
.dz{position:absolute;top:0;bottom:0;background:rgba(48,164,108,.75);border-radius:8px}
.dn{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.cdisp{direction:ltr;text-align:center;font:800 42px ui-monospace,monospace;letter-spacing:12px;background:#0b0d13;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp{font-size:26px;padding:12px 0;background:#2c3247;color:#fff}
.swt{position:relative;direction:ltr;height:76px;border-radius:40px;background:#0b0d13;border:1px solid var(--line);margin:10px 0;overflow:hidden}
.swk{position:absolute;left:4px;top:4px;width:68px;height:68px;border-radius:50%;background:#3b4566;display:flex;align-items:center;justify-content:center;font-size:36px;touch-action:none;z-index:1}
.swk.ok{background:#1f5f3f}
.swh{position:absolute;right:20px;top:50%;transform:translateY(-50%) scaleX(-1);color:var(--mut);font-weight:800;letter-spacing:4px}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cg{padding:4px;background:var(--panel2);border:2px solid transparent;border-radius:14px;color:var(--txt);font-size:12px;font-weight:600}
.cg.on{border-color:var(--acc);background:#3b3121}
.cg canvas{display:block;width:100%;aspect-ratio:1}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mg{background:var(--panel2);color:var(--txt);border:2px solid transparent;padding:10px 4px;border-radius:14px;font-size:14px}
.mg b{display:block;font-size:30px;line-height:1.2}
.mg.on{border-color:var(--acc);background:#3b3121}
.kgrid{display:flex;flex-direction:column;gap:8px}
.kg{background:var(--panel2);color:var(--txt);border:2px solid transparent;text-align:right;padding:10px 12px;font-size:16px}
.kg span{display:block;font-size:13px;color:var(--mut);font-weight:500}
.kg.on{border-color:var(--acc);background:#3b3121}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{background:var(--panel2);color:var(--txt);border:2px solid transparent;padding:7px 12px;font-size:14px;border-radius:999px}
.chipb.on{border-color:var(--acc);background:#3b3121}
.prev{display:block;margin:0 auto;width:120px;height:120px}
.scode{font:800 24px ui-monospace,monospace;letter-spacing:3px;background:#0b0d13;border:1px solid var(--line);border-radius:12px;padding:6px 14px;flex:1;text-align:center}
.cg.tx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px}.cg .big2{font-size:26px;display:block}.cg.lk{opacity:.6}
.swb{width:34px;height:34px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.4)}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-90px);background:rgba(0,0,0,.88);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;transition:transform .25s;z-index:40;white-space:nowrap;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#vcBtn{position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;background:rgba(12,14,20,.9);border:2px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 13px;font-weight:800;font-size:16px;display:none;align-items:center;gap:6px}
#vcBtn.show{display:flex}#vcBtn.live{border-color:#3ddc84;background:#123222}#vcBtn.mute{border-color:#ff6b6b}#vcBtn.wait{opacity:.75}
#vcBtn.talk{box-shadow:0 0 0 4px rgba(61,220,132,.45)}
#vcBar{position:fixed;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:30;background:rgba(12,14,20,.88);border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-weight:700;font-size:14px;max-width:70vw;display:none}
#vcBar.show{display:block}
#vcBtn.map{bottom:auto;top:calc(50% + 56px)}#vcBar.map{bottom:auto;top:calc(50% + 104px)}
.spin{font-size:20px;color:var(--mut);margin-top:40vh;text-align:center}
.votes{margin-top:10px;display:flex;flex-direction:column;gap:6px;text-align:right}
.vrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:6px 10px}
.mini{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.5)}
</style>
</head>

<button id="vcBtn" data-act="voice" aria-label="الصوت">🎤 صوت</button><div id="vcBar"></div><div id="vcAudio" style="display:none"></div>
<script src="config.js"></script>
<script src="fbroom.js"></script>
<script type="module" src="fbnet.js"></script>
<script>
(()=>{
'use strict';
// ================= constants =================
const FAST = Math.max(1, +window.__FAST || 1);
const $ = s => document.querySelector(s);
const now = () => Date.now();
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = (s,n) => String(s||'').replace(/[\p{Cc}\p{Cf}\p{Co}]/gu,'').replace(/\s+/g,' ').trim().slice(0,n);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const fmt = s => { s=Math.max(0,s|0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const MINP = 4, MAXP = 20;
const DUR = {role:9, night:25, dawn:6, day:120, meet:80, res:8, lights:18, kcd:30, kinit:15};
for(const k in DUR) DUR[k] = DUR[k]/FAST;

const COLORS = [['أحمر','#e5484d'],['أزرق','#3e7bfa'],['أخضر','#30a46c'],['أصفر','#f5d90a'],['برتقالي','#f76b15'],
  ['بنفسجي','#8e4ec6'],['وردي','#e93d82'],['سماوي','#05a2c2'],['بني','#a07553'],['أبيض','#eeeeee'],
  ['ليموني','#bdee63'],['كحلي','#1f3a93'],['زيتي','#6b7f2a'],['خوخي','#ffb4a2'],['رمادي','#8b8d98'],['أسود','#2b2b2b'],['تركوازي','#2ec4b6'],['ذهبي','#d4a017'],['عنابي','#7b1e3a'],['لافندر','#c3a6ff'],
  ['ذهب لامع','#e6b422'],['فضة لامعة','#c9ced6'],['قوس قزح','#c05cff']];
const SPECIAL_COL={20:'gold',21:'silver',22:'rainbow'};
const HATS = ['برعم','شماغ','طاقية','تاج','كاوبوي','طبّاخ','نظارة','سماعات','حفلة','خوذة','وردة','هالة','قرون','ساحر','تاج ورد','قرصان','غترة','طاقية مكية','عقال ذهبي','قبعة صقّار','قرون متوهجة','نظارة ذهبية','شماغ أخضر','طاقية صوف'];
const OUTFITS = ['بدون','بشت','ببيونة','شنطة','وشاح','كرفتة','ثوب','فروة','خنجر','شماغ كتف','ثوب العيد'];
const BODIES = ['حبة','مكعب','قطوة','أرنب','دبدوب','روبوت','بطريق','فضائي','ديناصور','بومة','قنفذ','بطيخة','تمرة','سمبوسة','استكانة','دونات','بيضة','دلة'];

const HANDS = ['بدون','فنجال','دلة','مسبحة','مبخرة','فانوس','عيدية','علم','كوب شاي'];
const FXS = [['🚫','بدون'],['🏜️','أثر رمل'],['✨','أثر نجوم'],['🌸','أثر ورد'],['🫘','أثر بن'],['💡','هالة ضوء']];
const KSTY = [['🔪','سكين'],['🩴','نعال'],['🍳','مقلاة'],['☁️','مخدة']];

function applyProgress(d, takeAll){
  if(!d || typeof d!=='object') return;
  (Array.isArray(d.owned)?d.owned:[]).forEach(k=>{ if(typeof k==='string') owned.add(k); });
  for(const k in STATS) STATS[k]=Math.max(STATS[k]||0, +((d.stats&&d.stats[k])||0)||0);
  if(takeAll){
    if(typeof d.coins==='number' && d.coins>=0) coins=Math.floor(d.coins);
    if(typeof d.name==='string' && d.name){ savedName=clean(d.name,12); lsSetRaw('mk_name',savedName); }

function autoCorr(rooms, links){
  const out=[];
  links.forEach(([i,j])=>{ let a=rooms[i], b=rooms[j];
    const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x), oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
    if(oy>=90 && (a.x+a.w<=b.x || b.x+b.w<=a.x)){ if(a.x>b.x){ const t=a; a=b; b=t; } const cy=(Math.max(a.y,b.y)+Math.min(a.y+a.h,b.y+b.h))/2; out.push([a.x+a.w, cy-40, b.x-(a.x+a.w), 80, 'h']); }
    else if(ox>=90 && (a.y+a.h<=b.y || b.y+b.h<=a.y)){ if(a.y>b.y){ const t=a; a=b; b=t; } const cx=(Math.max(a.x,b.x)+Math.min(a.x+a.w,b.x+b.w))/2; out.push([cx-40, a.y+a.h, 80, b.y-(a.y+a.h), 'v']); }
    else console.warn('bad link', i, j);
  });
  return out;
}

// ================= crypto (secret roles & actions) =================
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u8 => { let s=''; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); };
const unb64 = s => { const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
const CR = {ok: !!(window.crypto && crypto.subtle), kp:null, pub:'x', keys:new Map()};
async function initCrypto(){
  if(!CR.ok || CR.kp) return;
  try{
    CR.kp = await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'}, false, ['deriveKey']);
    CR.pub = b64(new Uint8Array(await crypto.subtle.exportKey('raw', CR.kp.publicKey)));
  }catch(e){ CR.ok=false; CR.pub='x'; }
}
function keyFor(pub){
  let k = CR.keys.get(pub);
  if(!k){
    k = (async()=>{
      const pk = await crypto.subtle.importKey('raw', unb64(pub), {name:'ECDH',namedCurve:'P-256'}, false, []);
      return crypto.subtle.deriveKey({name:'ECDH',public:pk}, CR.kp.privateKey, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
    })();
    CR.keys.set(pub,k);
  }
  return k;
}
async function seal(pub, obj){
  const data = te.encode(JSON.stringify(obj));
  if(!CR.ok || !pub || pub==='x') return 'p'+b64(data);
  try{
    const k = await keyFor(pub); const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,data));
    const out = new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12); return 'e'+b64(out);
  }catch(e){ return 'p'+b64(data); }
}
async function unseal(pub, blob){
  if(!blob || typeof blob!=='string') return null;
  try{
    if(blob[0]==='p') return JSON.parse(td.decode(unb64(blob.slice(1))));
    if(!CR.ok || !pub || pub==='x') return null;
    const k = await keyFor(pub); const u = unb64(blob.slice(1));
    return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12))));
  }catch(e){ return null; }
}

function makeMockRoom(){ // local testing only: tabs on the same machine
  const bc = new BroadcastChannel('miin-alkhayin-mock');
  const me = Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
  let my = Object.freeze({}); const others = new Map(); let snap = Object.freeze([]); const ls = new Set(); let sched=false, sendT=null;
  const rebuild = () => { const a=[Object.freeze({peer:me,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:my,updatedAt:now()})];
    for(const [p,o] of others) a.push(Object.freeze({peer:p,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:o.presence,updatedAt:o.at})); snap=Object.freeze(a); };
  const notify = () => { if(sched) return; sched=true; setTimeout(()=>{ sched=false; rebuild(); const ch={peers:snap,joined:[],left:[],updated:[]}; ls.forEach(f=>f(ch)); },16); };
  const send = () => bc.postMessage({t:'p',peer:me,pres:my});
  bc.onmessage = e => { const m=e.data;
    if(m.t==='p'){ const o=others.get(m.peer); const js=JSON.stringify(m.pres); if(!o || o.js!==js){ others.set(m.peer,{presence:Object.freeze(m.pres),js,at:now(),last:now()}); notify(); } else o.last=now(); }
    else if(m.t==='bye'){ others.delete(m.peer); notify(); } else if(m.t==='hello') send(); };
  setInterval(()=>{ send(); let ch=false; for(const [p,o] of others) if(now()-o.last>4000){ others.delete(p); ch=true; } if(ch) notify(); },1000);
  addEventListener('pagehide',()=>bc.postMessage({t:'bye',peer:me}));
  bc.postMessage({t:'hello'}); rebuild();
  return {
    presence(patch){ const np={...my}; for(const k in patch){ if(patch[k]===null) delete np[k]; else np[k]=patch[k]; } my=Object.freeze(JSON.parse(JSON.stringify(np))); if(!sendT) sendT=setTimeout(()=>{sendT=null;send();},33); notify(); return Promise.resolve(); },
    peers(){ return snap; },
    onPeers(fn){ ls.add(fn); setTimeout(()=>{ rebuild(); fn({peers:snap,joined:snap,left:[],updated:[]}); },0); return ()=>ls.delete(fn); },
    connected(){ return true; }, onConnection(fn){ setTimeout(()=>fn(true),0); return ()=>{}; },
    async cloudGet(path){ try{ const v=localStorage.getItem('mk_mockcloud:'+path); return v?JSON.parse(v):null; }catch(e){ return null; } },
    async cloudSet(path, val){ localStorage.setItem('mk_mockcloud:'+path, JSON.stringify(val)); },
  };
}

function vcSupported(){ return !!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function vcInGame(){ const S=C.S; return !!(C.code && S && S.ph && S.ph!=='lobby' && S.ph!=='end'); }
function vcMode(){ return (C.S && C.S.vc) || 'm'; }
function vcIdx(peer){ const S=C.S; return (S && S.P) ? S.P.findIndex(x=>x[0]===peer) : -1; }
function vcDead(peer){
  const S=C.S; if(!S || !S.P) return false;
  if(peer===myPeer && (C.mi<0 || (C.priv && C.priv.a===0))) return true;
  const j=vcIdx(peer); if(j<0) return true;              // spectators count as ghosts
  return !!(S.P[j][2] || S.P[j][3]);
}
function vcMate(peer){ const p=C.priv; if(!p || p.r!=='T' || !Array.isArray(p.m)) return false; const j=vcIdx(peer); return j>=0 && p.m.includes(j); }
// can "a" be heard by "b" right now (as far as this phone knows)
function vcCan(a, b){
  if(!vcInGame()) return true;
  const mode=vcMode(); if(mode==='o') return false;
  if(vcDead(a)) return vcDead(b);                         // ghosts only reach ghosts
  const ph=C.S.ph;
  if(mode==='a' || ph==='meet' || ph==='res') return true;
  if(ph==='night'){ const other = a===myPeer ? b : a; return !vcDead(myPeer) && !vcDead(other) && vcMate(other); }
  return false;
}
function vcCanSpeakNow(){
  if(!vcInGame()) return true;
  const mode=vcMode(); if(mode==='o') return false;
  if(vcDead(myPeer) || mode==='a') return true;
  const ph=C.S.ph; return ph==='meet' || ph==='res' || (ph==='night' && C.priv && C.priv.r==='T' && Array.isArray(C.priv.m) && C.priv.m.length>0);
}

async function vcJoin(){
  if(VC.on || VC.joining || !C.code) return;
  if(!window.RTCPeerConnection){ toast('جهازك أو المتصفح ما يدعم الصوت 😕'); return; }
  VC.joining=true; vcRender();

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-media');
    VC.mic = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false});
  }catch(e){ console.warn('mic', e); VC.mic=null; toast('ما فيه إذن للمايك — بتسمع بس 🎧'); }

  if(!VC.hint){ VC.hint=true; setTimeout(()=>{ if(VC.on) toast(vcInGame() ? '🎤 دخلت الصوت' : '🎤 دخلت الصوت — اضغط الزر عشان تسكّر المايك'); }, 300); }

}
function vcLeave(){
  for(const peer of [...VC.pcs.keys()]) vcClose(peer, true);
  if(VC.mic){ VC.mic.getTracks().forEach(t=>t.stop()); VC.mic=null; }
  VC.an=null; VC.on=false; VC.joining=false; VC.sig={}; VC.speaking.clear(); VC.lvl.clear();
  if(mePres.vo || mePres.v) pub({vo:null, v:null});
  vcRender();
}
function vcSig(peer, o){ if(o) VC.sig[peer]=o; else delete VC.sig[peer]; pub({v: Object.keys(VC.sig).length ? {...VC.sig} : null}); }
function vcClose(peer, keepSig){
  const e=VC.pcs.get(peer); if(!e) return;
  VC.pcs.delete(peer);
  try{ e.pc.close(); }catch(_){}
  if(e.tr) try{ e.tr.stop(); }catch(_){}
  if(e.audio){ try{ e.audio.srcObject=null; e.audio.remove(); }catch(_){} }
  VC.lvl.delete(peer); VC.speaking.delete(peer);
  if(!keepSig && VC.sig[peer]) vcSig(peer, null);
}
function vcGathered(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const t=setTimeout(res, 2500);
    pc.addEventListener('icegatheringstatechange', ()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } });
  });
}
function vcNew(peer, sid, role){
  const pc=new RTCPeerConnection({iceServers:VC_ICE});
  const tr = VC.mic && VC.mic.getAudioTracks()[0] ? VC.mic.getAudioTracks()[0].clone() : null;
  if(tr) tr.enabled=false;
  const e={pc, sid, role, tr, audio:null, t0:now(), ans:false};
  pc.onconnectionstatechange = () => { const st=pc.connectionState; if(st==='disconnected'){ if(!e.dAt) e.dAt=now(); } else e.dAt=0; };
  pc.ontrack = ev => {
    if(VC.pcs.get(peer)!==e) return;
    if(!e.audio){ e.audio=document.createElement('audio'); e.audio.autoplay=true; e.audio.setAttribute('playsinline',''); $('#vcAudio').appendChild(e.audio); }
    e.audio.srcObject = (ev.streams && ev.streams[0]) ? ev.streams[0] : new MediaStream([ev.track]);
    e.audio.muted = !vcCan(peer, myPeer);
    e.audio.play().catch(()=>{});
  };
  VC.pcs.set(peer, e);
  return e;
}
async function vcOffer(peer){
  const sid=Math.random().toString(36).slice(2,8);
  const e=vcNew(peer, sid, 'o');
  try{
    const tx=e.pc.addTransceiver('audio', {direction:'sendrecv'});
    if(e.tr) await tx.sender.replaceTrack(e.tr);
    await e.pc.setLocalDescription(await e.pc.createOffer());
    await vcGathered(e.pc);
    if(VC.pcs.get(peer)!==e) return;
    vcSig(peer, {s:sid, o:e.pc.localDescription.sdp});
  }catch(err){ console.warn('vc offer', err); }
}
async function vcAnswer(peer, sig){
  const e=vcNew(peer, sig.s, 'a');
  try{
    await e.pc.setRemoteDescription({type:'offer', sdp:sig.o});
    const tx=e.pc.getTransceivers()[0];
    if(tx){ if(e.tr) await tx.sender.replaceTrack(e.tr); tx.direction='sendrecv'; }
    await e.pc.setLocalDescription(await e.pc.createAnswer());
    await vcGathered(e.pc);
    if(VC.pcs.get(peer)!==e) return;
    vcSig(peer, {s:sig.s, a:e.pc.localDescription.sdp});
  }catch(err){ console.warn('vc answer', err); }
}
function vcTick(){
  if(!VC.on){ vcRender(); return; }
  if(!C.code || !room){ vcLeave(); return; }
  if(!myPeer) return;
  const others=peersArr.filter(p=>!p.sameTab && p.presence && p.presence.g===C.code && p.presence.vo===1);
  const want=new Set(others.map(p=>p.peer));
  for(const peer of [...VC.pcs.keys()]) if(!want.has(peer)) vcClose(peer);
  for(const peer of Object.keys(VC.sig)) if(!want.has(peer)) vcSig(peer, null);
  for(const p of others){
    const X=p.peer, sig=(p.presence.v && p.presence.v[myPeer]) || null; const e=VC.pcs.get(X);
    if(myPeer < X){                                       // I start the call
      const st = e ? e.pc.connectionState : '';
      const stale = e && (st==='failed' || st==='closed' || (st==='disconnected' && e.dAt && now()-e.dAt>8000) || (st!=='connected' && st!=='disconnected' && now()-e.t0>20000));
      if(!e || stale){ if(e) vcClose(X, true); vcOffer(X); }
      else if(sig && sig.s===e.sid && sig.a && !e.ans){ e.ans=true; e.pc.setRemoteDescription({type:'answer', sdp:sig.a}).catch(err=>console.warn('vc ans', err)); }
    } else if(sig && sig.o && (!e || e.sid!==sig.s)){       // they start the call, I answer
      if(e) vcClose(X, true);
      vcAnswer(X, sig);
    }
  }
  vcGate(); vcLevels(); vcRender();
}
function vcGate(){
  for(const [peer,e] of VC.pcs){
    if(e.tr) e.tr.enabled = !VC.muted && vcCan(myPeer, peer);
    if(e.audio){ const m=!vcCan(peer, myPeer); if(e.audio.muted!==m) e.audio.muted=m; if(!m && e.audio.paused) e.audio.play().catch(()=>{}); }
  }
}
function vcMeter(){
  try{
    audioUnlock(); if(!AC || !VC.mic) return;
    const src=AC.createMediaStreamSource(VC.mic); const an=AC.createAnalyser(); an.fftSize=512; src.connect(an);
    VC.an=an; VC.anBuf=new Uint8Array(an.fftSize);
  }catch(e){ VC.an=null; }
}
function vcLevels(){
  const t=now(), TH=0.035, HOLD=700;
  for(const [peer,e] of VC.pcs){
    let lv=0;
    try{ const rc=e.pc.getReceivers()[0]; const ss=rc && rc.getSynchronizationSources ? rc.getSynchronizationSources() : []; if(ss.length) lv=ss[0].audioLevel||0; }catch(_){}
    const heard = e.audio && !e.audio.muted;
    if(heard && lv>TH) VC.lvl.set(peer, t);
    if(t-(VC.lvl.get(peer)||0) < HOLD) VC.speaking.add(peer); else VC.speaking.delete(peer);
  }
  let me=0;
  if(VC.an && VC.anBuf){ VC.an.getByteTimeDomainData(VC.anBuf); let m=0; for(let i=0;i<VC.anBuf.length;i++){ const d=Math.abs(VC.anBuf[i]-128); if(d>m) m=d; } me=m/128; }
  const sending = VC.mic && !VC.muted && vcCanSpeakNow();
  if(sending && me>0.08) VC.lvl.set(myPeer, t);
  if(myPeer){ if(sending && t-(VC.lvl.get(myPeer)||0) < HOLD) VC.speaking.add(myPeer); else VC.speaking.delete(myPeer); }
}
function vcRender(){

  }
  netState='ok';
  setTimeout(()=>cloudSync(), 600);
  setTimeout(()=>tryResume(), 2500);
  room.onPeers(()=>refreshPeers(), err=>{ console.warn('room', err); netState='noroom'; netWhy='FB:'+((err && (err.fb || err.code)) || 'x'); });

}

function nearStation(){ const p=C.priv; if(!p) return -1; for(const s of p.t){ if(Math.hypot(MP.st[s].x-C.x, MP.st[s].y-C.y)<62) return s; } return -1; }
function nearBody(){ const B=(C.S&&C.S.B)||[]; return B.find(b=>Math.hypot(b[0]-C.x,b[1]-C.y)<80) || null; }
function killCandidate(anyone){
  const S=C.S, p=C.priv; if(!S || !p) return -1;
  let best=-1, bd=66;
  S.P.forEach((pp,j)=>{ if(j===C.mi || isOut(j) || (!anyone && (p.m||[]).includes(j))) return; const o=C.others.get(pp[0]); if(!o) return; const d=Math.hypot(o.x-C.x,o.y-C.y); if(d<bd){ bd=d; best=j; } });
  return best;
}
function dayActions(){
  const S=C.S, p=C.priv; if(!p || modal.open) return [];

  C.killTarget=-1;
  if(alive && p.w) acts.push(['gun','🔫 السلاح']);
  if(canBanish()) acts.push(['banish','👳 اطرد']);
  if(alive && S.wp===1 && MP.wpn && !C.wpTried && Math.hypot(MP.wpn.x-C.x,MP.wpn.y-C.y)<65) acts.push(['forge','⚒️ صلّح السلاح']);
  if(alive && p.r==='T' && killDay(gameKm())){
    const tg=killCandidate(); C.killTarget=tg;
    const cd=Math.ceil((C.kcdUntil-now())/1000);
    if(cd>0) acts.push(['kill',`🔪 ${cd}`,true]);
    else acts.push(['kill', tg>=0 ? `🔪 اقتل ${esc(pName(tg))}` : '🔪 اقتل', tg<0]);
  }
  const st=nearStation();
  if(st>=0){ const done = FAKE(p.r) ? C.fakeDone.has(st) : C.tasksDone.has(st); if(!done) acts.push(['use',`${MP.st[st].e} سوّ المهمة`]); }
  if(MP.cam && Math.hypot(MP.cam.x-C.x,MP.cam.y-C.y)<60) acts.push(['cam','📹 الكاميرات']);
  if(alive){
    if(nearBody()) acts.push(['report','📢 بلّغ عن الجثة']);
    if(Math.hypot(MP.bell.x-C.x,MP.bell.y-C.y)<85 && !(S.eu||[]).includes(C.mi) && !S.fi) acts.push(['emerg','🔔 اجتماع طارئ']);
    if(S.fi){ MP.fire.forEach((f,i)=>{ if(!S.fi[1+i] && Math.hypot(f.x-C.x,f.y-C.y)<65) acts.push(['ext','🧯 أطفي النار']); }); }
    if(p.r==='T'){ const cd=S.sc||0; const busy=(S.lo||0)>0 || !!S.fi || !!S.dl; acts.push(['sabm', busy?'💥 تخريب شغّال':cd>0?`💥 تخريب ${cd}`:'💥 تخريب', busy||cd>0]);

    sText(g,`${pName(s.d.by)} لقى جثة ${pName(s.d.v)}`,cx,Hh*0.78,Math.min(26,W/15),'#fff',Math.min(1,el/500));
  } else if(s.type==='emerg'){
    g.fillStyle='#0d1a3a'; g.fillRect(0,0,W,Hh);
    const rings=3; for(let i=0;i<rings;i++){ const r=((el/8)+i*80)%260; g.strokeStyle=`rgba(255,209,102,${1-r/260})`; g.lineWidth=4; g.beginPath(); g.arc(cx,cy,r,0,7); g.stroke(); }
    g.save(); g.translate(cx,cy); g.rotate(Math.sin(el/60)*0.35*Math.max(0,1-el/1800)); g.font=`${Math.min(130,W/3)}px serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('🔔',0,0); g.restore();
    sText(g,'اجتماع طارئ!',cx,Hh*0.2,Math.min(56,W/7),'#ffd166',1);
    sText(g,`${pName(s.d.by)} ضرب الجرس`,cx,Hh*0.8,Math.min(26,W/15),'#fff',Math.min(1,el/500));
  } else if(s.type==='sunset'){
    const grd=g.createLinearGradient(0,0,0,Hh); grd.addColorStop(0,'#2b1c40'); grd.addColorStop(0.55,'#d0587a'); grd.addColorStop(1,'#ffae6b'); g.fillStyle=grd; g.fillRect(0,0,W,Hh);
    const sy=Hh*0.45 + ease(el/2000)*Hh*0.3; g.fillStyle='#ffd166'; g.beginPath(); g.arc(cx,sy,Math.min(W,Hh)*0.14,0,7); g.fill();
    g.fillStyle='#2a1a12'; g.beginPath(); g.moveTo(0,Hh*0.72); for(let x=0;x<=W;x+=20) g.lineTo(x,Hh*0.72+Math.sin(x/60)*10); g.lineTo(W,Hh); g.lineTo(0,Hh); g.closePath(); g.fill();
    sText(g,'🌇 غابت الشمس',cx,Hh*0.18,Math.min(52,W/7),'#fff',1); sText(g,'وقت الاجتماع والتصويت',cx,Hh*0.86,Math.min(26,W/15),'#fff',Math.min(1,el/500));
  } else if(s.type==='eject'){
    const grd=g.createLinearGradient(0,0,0,Hh); grd.addColorStop(0,'#05060f'); grd.addColorStop(1,'#1d1a3a'); g.fillStyle=grd; g.fillRect(0,0,W,Hh);
    for(let i=0;i<70;i++){ const x=(i*97.3)%W, y=(i*53.7)%(Hh*0.6); g.fillStyle=`rgba(255,255,255,${0.3+0.7*Math.abs(Math.sin(el/400+i))})`; g.fillRect(x,y,2,2); }
    g.fillStyle='#3a2a1a'; g.beginPath(); g.moveTo(0,Hh*0.7); for(let x=0;x<=W;x+=20) g.lineTo(x,Hh*0.7+Math.sin(x/90)*18); g.lineTo(W,Hh); g.lineTo(0,Hh); g.closePath(); g.fill();
    const gx=W*0.16, gy=Hh*0.7; g.fillStyle='#6d402a'; g.fillRect(gx-40,gy-110,16,110); g.fillRect(gx+24,gy-110,16,110); g.beginPath(); g.arc(gx,gy-110,40,Math.PI,0); g.lineWidth=16; g.strokeStyle='#6d402a'; g.stroke();
    const R0 = s.d.ban ? s.d : (S&&S.R||s.d); const ej=R0.ej;
    if(ej>=0){ const k=clamp((el-300)/2600,0,1); const x=gx+ (W*0.95-gx)*k; const scl=sc*0.8*(1-k*0.6);
      g.save(); g.globalAlpha=1-Math.max(0,(k-0.75)/0.25); drawGuy(g,x,gy-16*scl,pCol(ej),1,{t:el,moving:true,hat:pHat(ej),outfit:pOut(ej),body:pBody(ej),scale:scl}); g.restore();
      const line1 = s.d.ban ? (ej===C.mi ? 'شيخ القرية طردك من القرية…' : `👳 شيخ القرية طرد ${pName(ej)}…`) : `${pName(ej)} طلع من القرية…`; const n=Math.min(line1.length, Math.floor(el/55));
      sText(g,line1.slice(0,n),cx,Hh*0.2,Math.min(38,W/10),'#fff',1);
      if(el>line1.length*55+400){ const a=Math.min(1,(el-line1.length*55-400)/300); const isT=R0.r==='T', isJ=R0.r==='J';
        sText(g, isJ?'وكان المهرّج! 🃏':isT?'وكان خاين! 😈':'وما كان خاين 😢', cx, Hh*0.3, Math.min(36,W/10), isJ?'#c77dff':isT?'#ff5a5f':'#ffd166', a); }
    } else {
      const k=(el/1600)%1; const x=-40+(W+80)*k; const y=gy-18; g.save(); g.translate(x,y); g.rotate(el/150); g.strokeStyle='#a68a5a'; g.lineWidth=3; g.beginPath(); g.arc(0,0,18,0,7); g.moveTo(-18,0); g.lineTo(18,0); g.moveTo(0,-18); g.lineTo(0,18); g.moveTo(-12,-12); g.lineTo(12,12); g.stroke(); g.restore();
      sText(g, R0.tie?'تعادل! محد طلع':'محد طلع من القرية', cx, Hh*0.22, Math.min(38,W/10), '#fff', Math.min(1,el/400));
    }
  }
}

// ================= movement & input =================
const keys={};
addEventListener('keydown',e=>{ if(e.target && e.target.tagName==='INPUT') return; keys[e.key.toLowerCase()]=true; });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
const joy={id:null,bx:0,by:0,dx:0,dy:0};
function showJoy(){ const b=$('#joyBase'); if(!b) return; b.classList.remove('hidden'); b.style.left=joy.bx+'px'; b.style.top=joy.by+'px'; $('#joyKnob').style.transform='translate(0,0)'; }
function hideJoy(){ const b=$('#joyBase'); if(b) b.classList.add('hidden'); }
cv.addEventListener('pointerdown',e=>{ if(!MAPSCR(ui.screen)||modal.open||joy.id!==null) return; joy.id=e.pointerId; joy.bx=e.clientX; joy.by=e.clientY; joy.dx=joy.dy=0; try{ cv.setPointerCapture(e.pointerId); }catch(_){} showJoy(); e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(e.pointerId!==joy.id) return; let dx=e.clientX-joy.bx, dy=e.clientY-joy.by; const L=Math.hypot(dx,dy), M=55; if(L>M){ dx*=M/L; dy*=M/L; } joy.dx=dx/M; joy.dy=dy/M; const k=$('#joyKnob'); if(k) k.style.transform=`translate(${dx}px,${dy}px)`; });
const endJoy=e=>{ if(e.pointerId!==joy.id) return; joy.id=null; joy.dx=joy.dy=0; hideJoy(); };
cv.addEventListener('pointerup',endJoy); cv.addEventListener('pointercancel',endJoy);
function blockedSet(m){
  const S=C.S; if(!S || S.ph!=='day' || !S.dl || m!==MP) return null;
  const set=new Set(); m.cRooms.forEach((rs,i)=>{ if(rs.includes(S.dl[0]) && !inRect(m.cw[i],C.x,C.y)) set.add(i); }); return set;
}
function stepMove(dt, m, ghost){
  if(!modal.open && !SC){
    let dx=joy.dx, dy=joy.dy;
    if(keys['arrowleft']||keys['a']) dx-=1; if(keys['arrowright']||keys['d']) dx+=1; if(keys['arrowup']||keys['w']) dy-=1; if(keys['arrowdown']||keys['s']) dy+=1;
    const len=Math.hypot(dx,dy);
    if(len>0.12){ const sp=180*Math.min(1,len); const ux=dx/len, uy=dy/len; const nx=C.x+ux*sp*dt, ny=C.y+uy*sp*dt;
      if(ghost){ C.x=clamp(nx,20,m.W-20); C.y=clamp(ny,20,m.H-20); }
      else { const blk=blockedSet(m); if(walkable(m,nx,ny,blk)){ C.x=nx; C.y=ny; } else if(walkable(m,nx,C.y,blk)) C.x=nx; else if(walkable(m,C.x,ny,blk)) C.y=ny; }
      if(Math.abs(ux)>0.15) C.dir=ux>0?1:-1; C.moving=true; C.moved=true; }
    else C.moving=false;
  } else C.moving=false;
  if(ghost){ if(mePres.x!=null) pub({x:null,y:null}); }
  else if(now()-C.lastPosPub>100){ const rx=Math.round(C.x), ry=Math.round(C.y); if(rx!==mePres.x||ry!==mePres.y) pub({x:rx,y:ry}); C.lastPosPub=now(); }
}

// ================= main loop =================
function frame(t){
  try{
    refreshPeers(); syncState();
    const scr=computeScreen(); show(scr);
    if(UPD[scr]) UPD[scr]();
    const tv=fmt(C.S?C.S.t:0); document.querySelectorAll('[data-t]').forEach(el=>{ if(el.textContent!==tv) el.textContent=tv; });
    const dt=Math.min(0.05,(t-lastT)/1000);
    if(scr==='day'){ const ghost=C.priv && C.priv.a===0; stepMove(dt, MP, ghost); drawGame(t); }
    else if(scr==='lobby'){ stepMove(dt, HUB, false); drawHub(t); }
    if(!MAPSCR(scr) && modal.open && modal.kind==='task') closeModal();
    if(!['lobby'].includes(scr) && modal.open && ['skin','settings','players'].includes(modal.kind)) closeModal();
    if(modal.open && modal.kind==='gun' && !['day','night','meet'].includes(scr)) closeModal();
    if(modal.open && ['sab','cam'].includes(modal.kind) && scr!=='day') closeModal();
    if(modal.open && modal.kind==='cam') drawCams(t);
    if(SC) drawScene(t);
  }catch(e){ console.error(e); }
  lastT=t; requestAnimationFrame(frame);
}
show('connecting'); requestAnimationFrame(frame);
initNet();
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); window.__installEvt=e; });
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
if(window.__FAST) window.__dbg={drawGuy, drawPet, MAPS, walkable, mapCanvas, C, get H(){ return H; }, openTask, ACT, playScene, finishForge, get MP(){ return MP; }, get peers(){ return peersArr; }, get myPeer(){ return myPeer; }, VC, vcCan, vcCanSpeakNow, get STATS(){ return STATS; }, testMini:(t,em)=>{ window.__miniDone=0; openModal('task','test',''); MINI[t]($('#mbody'), ()=>{ window.__miniDone=1; closeModal(); }, em||'🍂'); }};
})();
</script>
